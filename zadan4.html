<!doctype html>
<html lang="ru">
<head>
    <title>Калькулятор</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        .btn-number { background-color: #007bff; color: white; font-size: 1.5rem; padding: 15px; }
        .btn-operator { background-color: #ff8800; color: white; font-size: 1.5rem; padding: 15px; }
        .calculator-container { max-width: 66%; margin: auto; }
        .btn-group { margin-bottom: 15px; }
        .btn-group .btn { margin: 5px; }
        #display { height: 70px; font-size: 2rem; }
    </style>
</head>
<body>
    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-8 calculator-container">
                <input id="display" class="form-control text-right mb-3" readonly>
                <div class="d-grid gap-3">
                    <div class="btn-group d-flex">
                        <button class="btn btn-number flex-fill w-25" onclick="addToDisplay('7')">7</button>
                        <button class="btn btn-number flex-fill w-25" onclick="addToDisplay('8')">8</button>
                        <button class="btn btn-number flex-fill w-25" onclick="addToDisplay('9')">9</button>
                        <button class="btn btn-operator flex-fill w-25" onclick="addToDisplay('/')">/</button>
                    </div>
                    <div class="btn-group d-flex">
                        <button class="btn btn-number flex-fill w-25" onclick="addToDisplay('4')">4</button>
                        <button class="btn btn-number flex-fill w-25" onclick="addToDisplay('5')">5</button>
                        <button class="btn btn-number flex-fill w-25" onclick="addToDisplay('6')">6</button>
                        <button class="btn btn-operator flex-fill w-25" onclick="addToDisplay('*')">*</button>
                    </div>
                    <div class="btn-group d-flex">
                        <button class="btn btn-number flex-fill w-25" onclick="addToDisplay('1')">1</button>
                        <button class="btn btn-number flex-fill w-25" onclick="addToDisplay('2')">2</button>
                        <button class="btn btn-number flex-fill w-25" onclick="addToDisplay('3')">3</button>
                        <button class="btn btn-operator flex-fill w-25" onclick="addToDisplay('+')">+</button>
                    </div>
                    <div class="btn-group d-flex">
                        <button class="btn btn-number flex-fill w-75" onclick="addToDisplay('0')">0</button>
                        <button class="btn btn-operator flex-fill w-25" onclick="calculateResult()">=</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addToDisplay(value) {
            document.getElementById('display').value += value;
        }

        function calculateResult() {
            try {
                document.getElementById('display').value = eval(document.getElementById('display').value);
            } catch (e) {
                alert('Ошибка ввода');
            }
        }
    </script>
</body>
</html>
